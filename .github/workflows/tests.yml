name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only: no pip install needed (psutil is optional).
      # No test needs Ollama, the network, real hotkeys or a visible window.
      - name: Run unit tests
        run: python -m unittest -v
